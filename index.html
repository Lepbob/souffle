<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141C2F"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png"><style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Souffle</title>

<style>
/* Concept : carnet d'entraînement de poche. Gros chiffres condensés pour les répétitions,
   fond bleu-gris froid, un seul accent cobalt, une couleur par rôle de séance. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --surface2:#E9EDF6; --line:#D9DFEC;
  --fg:#0F1A2E; --muted:#56637E; --accent:#2748D8; --accent-soft:#E3E8FD; --on-accent:#FFFFFF;
  --good:#1B7F52; --good-soft:#DDF2E7; --warn:#9A5B0B; --warn-soft:#FBEBCF; --bad:#B3302F; --bad-soft:#F9DEDD;
  --r-key:#2748D8; --r-mod:#0E7C86; --r-light:#5B6B8A; --r-hand:#B4560F;
  --f-disp:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow:0 1px 2px rgba(15,26,46,.06),0 4px 14px rgba(15,26,46,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1120; --surface:#141C2F; --surface2:#1C2640; --line:#27324F;
  --fg:#E8ECF6; --muted:#97A3BF; --accent:#8CA2FF; --accent-soft:#1D2850; --on-accent:#0B1120;
  --good:#5FD39A; --good-soft:#12301F; --warn:#F0B866; --warn-soft:#3A2A0E; --bad:#FF8E8C; --bad-soft:#3F1717;
  --r-key:#8CA2FF; --r-mod:#58C6D0; --r-light:#9AA8C6; --r-hand:#F0A16A;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#141C2F; --surface2:#1C2640; --line:#27324F;
  --fg:#E8ECF6; --muted:#97A3BF; --accent:#8CA2FF; --accent-soft:#1D2850; --on-accent:#0B1120;
  --good:#5FD39A; --good-soft:#12301F; --warn:#F0B866; --warn-soft:#3A2A0E; --bad:#FF8E8C; --bad-soft:#3F1717;
  --r-key:#8CA2FF; --r-mod:#58C6D0; --r-light:#9AA8C6; --r-hand:#F0A16A;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;margin:0;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding-bottom:96px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
.disp{font-family:var(--f-disp);font-weight:700;letter-spacing:.01em;line-height:1}
.muted{color:var(--muted)} .small{font-size:13px} .tnum{font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* en-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
.brand{font-family:var(--f-disp);font-weight:700;font-size:28px;letter-spacing:.02em}
.brand b{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.key{background:var(--accent-soft);color:var(--r-key)} .pill.mod{background:var(--surface2);color:var(--r-mod)}
.pill.light{background:var(--surface2);color:var(--r-light)} .pill.hand{background:var(--warn-soft);color:var(--r-hand)}

/* cartes */
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;background:transparent}
.hero{padding:0;overflow:hidden}
.hero .lane{height:10px;background:repeating-linear-gradient(90deg,var(--role,var(--accent)) 0 22px,transparent 22px 30px);opacity:.9}
.hero .in{padding:16px}
.spec{font-family:var(--f-disp);font-weight:700;font-size:64px;line-height:.95;letter-spacing:.005em;margin:8px 0 2px}
.spec small{font-size:30px;font-weight:600;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0}
.kv dt{color:var(--muted);font-size:13px} .kv dd{margin:0;font-weight:500}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px}
.banner.warn{background:var(--warn-soft);color:var(--warn)} .banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.good{background:var(--good-soft);color:var(--good)} .banner.info{background:var(--accent-soft);color:var(--accent)}
.banner b{font-weight:600}
ul.clean{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.clean li{padding-left:16px;position:relative}
ul.clean li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--muted)}
ol.steps{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* boutons */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:11px 16px;font-weight:600;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:70px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 8px;font-weight:500;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:48px;font-family:var(--f-disp);font-weight:700;font-size:24px}
.rpe button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* champs */
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--muted)}
input[type=file]{padding:8px!important}

/* onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs nav{display:flex;width:100%;max-width:560px;gap:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted);min-height:48px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* tableaux & barres */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.bars .b i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}
.bars .b i.cur{background:var(--r-mod)}
.bars .b i.alert{background:var(--bad)}
.bars .b span{font-size:11px;color:var(--muted)}
.item{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.sep{height:1px;background:var(--line);margin:4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:min(90vw,420px);text-align:center}
pre.code{white-space:pre-wrap;word-break:break-word;background:var(--surface2);border-radius:10px;padding:10px 12px;font-family:var(--f-body);font-size:14px;margin:8px 0 0}
@media (max-width:380px){.spec{font-size:54px}.grid2{grid-template-columns:1fr}}
.trace{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:8px}
.opt ul{font-weight:400;color:var(--text)}.opt{display:block;width:100%;text-align:left;padding:12px 14px;min-height:0}.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
'use strict';

/* ================= Utilitaires ================= */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);};
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/864e5);
const mondayOf=s=>addDays(s,-((parseD(s).getDay()+6)%7));
const todayStr=()=>ymd(new Date());
const frDate=(s,o)=>parseD(s).toLocaleDateString('fr-FR',o||{weekday:'long',day:'numeric',month:'long'});
const frShort=s=>parseD(s).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmtPace=s=>{if(!s||!isFinite(s))return '–';let m=Math.floor(s/60),r=Math.round(s%60);if(r===60){m++;r=0;}return m+"'"+pad(r);};
function parseDur(t){
  if(t==null)return null;t=String(t).trim().replace(',','.').replace(/["”″s]$/,'');if(!t)return null;
  if(/^\d+(\.\d+)?$/.test(t))return Math.round(parseFloat(t)*60);
  const ps=t.split(/[:'’m]/).map(x=>x.trim());if(ps.length<2||ps.length>3||ps.some(x=>!/^\d{1,3}$/.test(x)))return null;
  const n=ps.map(Number),sec=n[n.length-1],min=n[n.length-2],h=n.length===3?n[0]:0;
  if(sec>59||(h&&min>59))return null;return h*3600+min*60+sec;
}
const fmtDur=sec=>{if(sec==null||!isFinite(sec))return '–';sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),r=sec%60;return h?h+':'+pad(m)+':'+pad(r):m+':'+pad(r);};
const fmtEffSec=sec=>sec<120?(Math.round(sec*10)/10+'').replace('.',',')+' s':fmtDur(sec);
function parsePace(t){
  if(t==null)return null;t=String(t).trim().replace(/[”"″]/g,'');if(!t)return null;
  const m=t.match(/^(\d{1,2})\s*[:'’.,h]\s*(\d{1,2})$/);if(m){return +m[1]*60+ +m[2];}
  const n=t.match(/^(\d{1,2})$/);if(n)return +n[1]*60;return null;
}
const fmtRest=s=>{const m=Math.floor(s/60),r=s%60;return m?(r?m+' min '+r:m+' min'):r+' s';};
const fmtEff=e=>e.t==='time'?(e.v>=60?(e.v/60)+' min':e.v+' s'):e.v+' m';

/* ================= Plan : échelles de niveau ================= */
const T=(v)=>({t:'time',v:v}), D=(v)=>({t:'dist',v:v});
const SAT=[
  {n:10,eff:T(60),rest:{s:120,m:'en marchant'}},
  {n:10,eff:T(60),rest:{s:90,m:'en trottinant'}},
  {n:10,eff:T(60),rest:{s:60,m:'en trottinant'}},
  {n:8,eff:T(120),rest:{s:90,m:'en trottinant'}},
  {n:8,eff:T(120),rest:{s:60,m:'en trottinant'}},
  {n:6,eff:T(180),rest:{s:90,m:'en trottinant'}},
  {n:6,eff:T(180),rest:{s:60,m:'en trottinant'}},
  {n:5,eff:T(240),rest:{s:90,m:'en trottinant'}}
];
const TUE=[
  {n:6,eff:D(100),rest:{s:60,m:'en marchant'}},
  {n:8,eff:D(100),rest:{s:60,m:'en trottinant'}},
  {n:6,eff:D(200),rest:{s:90,m:'en trottinant'}},
  {n:8,eff:D(200),rest:{s:75,m:'en trottinant'}},
  {n:5,eff:D(400),rest:{s:90,m:'en trottinant'}}
];
const THU=[20,25,30,35];
const LADDER={sat:SAT,tue:TUE};
const BASE={sat:[1,2,3,1],tue:[0,1,2,0],thu:[0,1,2,0]};        // semaines 1 à 4 (la 4 est une semaine d'allègement)
const PLAN_WEEKS=4;
const ROLE={tue:'mod',thu:'light',sat:'key'};
const ROLE_NAME={key:'Séance clé',mod:'Qualité modérée',light:'Léger',hand:'Hand'};
const DOW={tue:1,wed:2,thu:3,sat:5};
const EXPECT_RPE={sat:7,tue:5,thu:3};
const PHASES=[
  {n:1,w:[1,4],name:'Reprise',goal:'Base d\u2019endurance, habituer le corps.',txt:'Footing continu, fractionné court très facile, renforcement léger.'},
  {n:2,w:[5,8],name:'Développement',goal:'Monter la capacité à haute intensité.',txt:'30/30 (en distance), 1 min/1 min, tempo court.'},
  {n:3,w:[9,12],name:'Spécifique hand',goal:'Imiter l\u2019effort du match.',txt:'15/15 (en distance), répétitions de sprints courts, changements de direction, sauts.'},
  {n:4,w:[13,16],name:'Consolidation',goal:'Tenir 60 minutes.',txt:'Blocs d\u2019intermittent de 10 à 15 min, séance « simulation de match ».'}
];
const MAINT_PHASE={n:0,w:[1,12],name:'Maintien',goal:'Conserver la forme obtenue.',txt:'Deux séances par semaine (mardi et samedi) à niveau modéré constant, allégées la 4e semaine. Le hand du mercredi reste dans la charge.'};
const MBASE={sat:[3,3,3,2],tue:[2,2,2,1],thu:[0,0,0,0]};
function ensurePlans(x){
  if(!x.plans||!x.plans.length)x.plans=[{id:'p1',type:'cycle',name:'Cycle 1',start:(x.profile&&x.profile.start)||'2026-10-26',weeks:16,keys:['tue','thu','sat'],shift:{sat:0,tue:0,thu:0},level:'zero',closed:null}];
  return x;
}
function P(){ensurePlans(S);const t=todayStr();let a=S.plans[0];S.plans.forEach(function(q){if(q.start<=t)a=q;});return a;}
const planEnd=pl=>addDays(pl.start,7*pl.weeks-1);
const detailedWeeks=()=>P().type==='maintien'?P().weeks:PLAN_WEEKS;
function baseLevel(type,shift,key,wk){const b=type==='maintien'?MBASE[key][(wk-1)%4]:BASE[key][wk-1];return b==null?null:b+((shift&&shift[key])||0);}
const phaseOf=w=>P().type==='maintien'?MAINT_PHASE:(PHASES.find(p=>w>=p.w[0]&&w<=p.w[1])||PHASES[3]);
const RENFO=[
  'Planche sur les avant-bras : 3 × 30 s',
  'Planche latérale : 2 × 20 s de chaque côté',
  'Squats au poids du corps : 2 × 12',
  'Fentes avant : 2 × 8 par jambe',
  'Montées sur pointes (mollets) : 2 × 15',
  'Équilibre sur une jambe : 3 × 30 s par jambe (puis yeux fermés)'
];
const PACE_FACTOR={t:{60:.74,120:.80,180:.83,240:.85},d:{100:.78,200:.80,400:.83}};
function targetPace(ref,e){const f=(e.t==='time'?PACE_FACTOR.t:PACE_FACTOR.d)[e.v]||.8;return ref*f;}
function ladderLabel(key,lvl){
  if(key==='thu')return THU[clamp(lvl,0,THU.length-1)]+' min de footing facile + renforcement';
  const L=LADDER[key][clamp(lvl,0,LADDER[key].length-1)];
  return L.n+' × '+fmtEff(L.eff)+', récupération '+fmtRest(L.rest.s)+' '+L.rest.m;
}

/* ================= État & stockage ================= */
const KEY='souffle.v1';
let memOnly=false;
function defaults(){
  return {
    v:1,
    profile:{age:22,height:178,weight:84,refPace:380,start:'2026-10-26',remindTime:'18:30',alertPct:10,loc:null},
    sync:{owner:'Lepbob',repo:'souffle-data',path:'souffle-sauvegarde.json',auto:true},
    offsets:{sat:0,tue:0,thu:0},
    moves:{},skips:{},pre:{},boost:{},pains:[],
    trash:[],
    logs:[{id:'seed-20261024',kind:'run',key:null,sessionId:null,date:'2026-10-24',durMin:33,distKm:4.9,
      repsDone:10,repsPlanned:10,avgPace:275,firstPace:null,lastPace:null,rpe:null,reason:'',
      verdict:null,delta:0,source:'gpx',
      note:'Séance de départ : fractionné 10 × 1 min programmé sur la montre, récupération en marche. Ressenti à compléter.'}]
  };
}
let S=load();
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1){const d=defaults();return Object.assign(d,o,{profile:Object.assign(d.profile,o.profile||{}),offsets:Object.assign(d.offsets,o.offsets||{}),sync:Object.assign(d.sync,o.sync||{})});}}}
  catch(e){memOnly=true;}
  return defaults();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){memOnly=true;}scheduleSync();}

/* ================= Moteur : douleurs, séances, niveaux ================= */
const ZONES=['Genou','Mollet','Tendon d\u2019Achille','Tibia','Cuisse','Hanche','Dos','Pied','Cheville'];
const PAIN_LV={legere:{n:'Gêne légère',days:3},douleur:{n:'Douleur',days:5},forte:{n:'Forte douleur',days:10}};
function painState(date){
  let best=null;const rank={legere:1,douleur:2,forte:3,persistante:4};
  S.pains.forEach(p=>{
    const age=diffDays(date,p.date);if(age<0)return;
    if(age<PAIN_LV[p.level].days){if(!best||rank[p.level]>rank[best.level])best={level:p.level,zone:p.zone,since:p.date,until:addDays(p.date,PAIN_LV[p.level].days)};}
  });
  const zones={};S.pains.forEach(p=>{if(diffDays(date,p.date)>=0&&diffDays(date,p.date)<=14){zones[p.zone]=(zones[p.zone]||0)+1;}});
  for(const z in zones){if(zones[z]>=3){const last=S.pains.filter(p=>p.zone===z).map(p=>p.date).sort().pop();
    if(diffDays(date,last)<14&&(!best||rank.persistante>rank[best.level]))best={level:'persistante',zone:z,since:last,until:addDays(last,14)};}}
  return best;
}
const sessIdOf=(pl,wk,key)=>(pl.id==='p1'?'':pl.id+'-')+'w'+wk+'-'+key;
const sessId=(wk,key)=>sessIdOf(P(),wk,key);
function parseSessId(id){const m=String(id).match(/^(?:(p\d+)-)?w(\d+)-(\w+)$/);return m?{pid:m[1]||'p1',wk:+m[2],key:m[3]}:null;}
function sessionById(id){const x=parseSessId(id);return (x&&x.pid===P().id)?buildSession(x.wk,x.key):null;}
const weekStart=wk=>addDays(P().start,7*(wk-1));
const plannedDate=(wk,key)=>addDays(weekStart(wk),DOW[key]);
const effDate=(wk,key)=>S.moves[sessId(wk,key)]||plannedDate(wk,key);
const logFor=id=>S.logs.find(l=>l.sessionId===id);

function buildSession(wk,key,opts){
  opts=opts||{};

  if(P().closed&&plannedDate(wk,key)>P().closed)return null;
  const id=sessId(wk,key),date=effDate(wk,key),role=ROLE[key];
  const maxL=key==='thu'?THU.length-1:LADDER[key].length-1;
  const adj=[];let lvl=baseLevel(P().type,P().shift,key,wk);
  const base=lvl;
  const off=S.offsets[key]||0;
  if(off){lvl+=off;adj.push({d:off,t:off>0?'Tes dernières séances étaient faciles : niveau relevé.':'Tes dernières séances étaient dures : niveau abaissé.'});}
  const pre=S.pre[date];
  if(!opts.noToday){
    if(pre==='fatigue'){lvl-=1;adj.push({d:-1,t:'Tu es fatigué aujourd\u2019hui : version allégée.'});}
    if(S.boost[id]&&pre==='bien'){lvl+=1;adj.push({d:1,t:'Tu es en forme et tu as choisi la version plus dure.'});}
  }
  let kind=key==='thu'?'easy':(key==='sat'&&isTestWeekOf(P(),wk)?'test':'intervals');
  const pain=painState(date);let painMsg=null;

    if(pain.level==='legere'&&key!=='thu'){lvl-=1;adj.push({d:-1,t:'Gêne légère ('+pain.zone.toLowerCase()+') : séance plus douce jusqu\u2019au '+frShort(pain.until)+'.'});}
    if(pain.level==='douleur'&&key!=='thu'){kind='easy';painMsg={cls:'warn',t:'Douleur ('+pain.zone.toLowerCase()+') : pas d\u2019intensité jusqu\u2019au '+frShort(pain.until)+'. Footing très facile à la place.'};}
    if((pain.level==='forte'||pain.level==='persistante')){kind='rest';painMsg={cls:'bad',t:(pain.level==='forte'?'Forte douleur':'Douleur qui revient')+' ('+pain.zone.toLowerCase()+') : pas de course. Un avis médical est conseillé avant de reprendre.'};}
  }
  let wxSlow=1;
  if(!opts.noToday&&locOk()&&kind!=='rest'){
    const wa=wxAdvice(date,sessionHour());
    if(wa){
      if(wa.eff.level&&kind==='intervals'){lvl+=wa.eff.level;adj.push({d:wa.eff.level,t:wa.eff.heatText});}
      if(wa.eff.slow&&kind==='intervals'){wxSlow=wa.eff.slow;adj.push({d:-1,t:wa.eff.heatText});}
      if(wa.eff.ice&&key!=='thu'&&kind==='intervals'){kind='easy';painMsg=painMsg||{cls:'warn',t:wa.eff.iceText};}
    }
  }
  lvl=clamp(lvl,0,maxL);
  const s={id,wk,key,role,date,planned:plannedDate(wk,key),level:lvl,base,adj,kind,pain:painMsg,
    title:kind==='test'?'Test VMA':key==='sat'?'Fractionné':key==='tue'?'Fractionné doux':'Footing facile et renforcement',
    done:!!logFor(id),skipped:!!S.skips[id],phase:phaseOf(wk)};
  const ref=S.profile.refPace;
  if(kind==='intervals'){
    const L=LADDER[key][lvl];s.n=L.n;s.eff=L.eff;s.rest=L.rest;s.pace=targetPace(ref,L.eff)*wxSlow;
    s.rpeTarget=key==='sat'?'8 sur 10':'6 à 7 sur 10, jamais plus (veille de hand)';

  }else if(kind==='easy'){

}

/* ================= Jugement d'une séance ================= */
function judge(s,d){
  const notes=[];let easy=0,hard=0;
  if(d.rpe==null)return {label:null,notes:['Ressenti manquant : la séance est enregistrée mais ne modifie pas le plan.'],delta:0};
  const exp=EXPECT_RPE[s.key];
  if(s.kind==='intervals'&&d.repsDone!=null){
    if(d.repsDone<s.n){hard+=2;notes.push(d.repsDone+' répétitions sur '+s.n+' prévues.');}
    else if(d.repsDone>s.n){easy+=1;notes.push((d.repsDone-s.n)+' répétition(s) de plus que prévu : comptées comme réalisées, la hausse suivante reste plafonnée.');}
    else notes.push('Les '+s.n+' répétitions sont faites.');
    if(d.avgPace&&s.pace){
      const r=d.avgPace/s.pace;
      if(r<.96&&d.rpe<=exp-1){easy+=1;notes.push('Allure moyenne des efforts '+fmtPace(d.avgPace)+' pour une cible de '+fmtPace(s.pace)+' : plus vite que prévu.');}
      else if(r>1.06){hard+=1;notes.push('Allure moyenne des efforts '+fmtPace(d.avgPace)+', plus lente que la cible de '+fmtPace(s.pace)+'.');}
      else notes.push('Allure moyenne des efforts '+fmtPace(d.avgPace)+' pour une cible de '+fmtPace(s.pace)+'.');
    }
    if(d.firstPace&&d.lastPace){
      const dr=d.lastPace/d.firstPace;
      if(dr<.97){easy+=1;notes.push('Tu accélères entre la première ('+fmtPace(d.firstPace)+') et la dernière répétition ('+fmtPace(d.lastPace)+') : signe d\u2019une séance trop facile.');}
      else if(dr>1.08){hard+=1;notes.push('Tu faiblis entre la première ('+fmtPace(d.firstPace)+') et la dernière répétition ('+fmtPace(d.lastPace)+').');}
      else notes.push('Allure stable entre la première et la dernière répétition.');
    }
  }
  if(d.rpe<=exp-2){easy+=2;notes.push('Ressenti '+d.rpe+'/10 pour un attendu de '+exp+' : facile.');}
  else if(d.rpe>=exp+3){hard+=3;notes.push('Ressenti '+d.rpe+'/10 pour un attendu de '+exp+' : très dur.');}
  else if(d.rpe>=exp+2){hard+=2;notes.push('Ressenti '+d.rpe+'/10 pour un attendu de '+exp+' : dur.');}
  else notes.push('Ressenti '+d.rpe+'/10, dans ce qui était attendu ('+exp+').');
  if(d.reason==='douleur'){hard+=2;} else if(d.reason==='fatigue'){hard+=1;}
  let label='bien',delta=0;
  if(hard>=3){label='trop dur';delta=-1;}
  else if(hard>=2){label='dur';}
  else if(easy>=2&&hard===0){label='facile';delta=1;}
  return {label,notes,delta};
}
function applyJudgement(s,res,log){
  const notes=res.notes.slice();let delta=res.delta;const k=s.key;const before=Object.assign({},S.offsets);
  const lastSame=S.logs.filter(l=>l.key===k&&l.sessionId).sort((a,b)=>a.date<b.date?-1:1).pop();
  if(delta>0&&lastSame&&lastSame.delta>0){delta=0;notes.push('Plafond de progression : deux hausses d\u2019affilée sont évitées. Le niveau reste le même cette fois.');}
  if(delta>0&&(S.offsets[k]||0)>=2){delta=0;notes.push('Le niveau est déjà 2 crans au-dessus du plan de base : on stabilise.');}
  if(delta<0&&(S.offsets[k]||0)<=-2){delta=0;}
  S.offsets[k]=clamp((S.offsets[k]||0)+delta,-2,2);
  log.delta=delta;log.verdict=res.label;
  const runs=S.logs.concat([log]).filter(l=>l.verdict).sort((a,b)=>a.date<b.date?-1:1);
  const last2=runs.slice(-2);
  if(last2.length===2&&last2.every(l=>l.verdict==='dur'||l.verdict==='trop dur')&&!(res.label==='trop dur'&&delta<0)){
    ['sat','tue','thu'].forEach(x=>{S.offsets[x]=clamp((S.offsets[x]||0)-1,-2,2);});
    notes.push('Deux séances dures d\u2019affilée : allègement automatique des prochaines séances.');
  }
  log.fx={};['sat','tue','thu'].forEach(x=>{const dd=(S.offsets[x]||0)-(before[x]||0);if(dd)log.fx[x]=dd;});
  return notes;
}

/* ================= Détection des répétitions (GPX) ================= */
function haversine(a,b){const R=6371000,t=Math.PI/180,la1=a.lat*t,la2=b.lat*t,dl=(b.lat-a.lat)*t,dn=(b.lon-a.lon)*t;
  const x=Math.sin(dl/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function parseGpx(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('Fichier illisible.');
  const nodes=doc.getElementsByTagName('trkpt');const pts=[];
  for(let i=0;i<nodes.length;i++){
    const n=nodes[i],tn=n.getElementsByTagName('time')[0];
    if(!tn)continue;const t=Date.parse(tn.textContent);
    const lat=parseFloat(n.getAttribute('lat')),lon=parseFloat(n.getAttribute('lon'));
    if(isFinite(t)&&isFinite(lat)&&isFinite(lon))pts.push({lat,lon,t:t/1000});
  }
  if(pts.length<20)throw new Error('Pas assez de points GPS dans ce fichier.');
  return pts;
}
function analyseTrack(pts,plan){
  const t0=pts[0].t,T=[],Dm=[0];
  pts.forEach((p,i)=>{T.push(p.t-t0);if(i)Dm.push(Dm[i-1]+haversine(pts[i-1],p));});
  const dur=T[T.length-1],total=Dm[Dm.length-1];
  const distAt=t=>{if(t<=0)return 0;if(t>=dur)return total;let lo=0,hi=T.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(T[m]<t)lo=m;else hi=m;}
    const f=(t-T[lo])/((T[hi]-T[lo])||1);return Dm[lo]+f*(Dm[hi]-Dm[lo]);};
  const timeAtDist=d=>{if(d<=0)return 0;if(d>=total)return dur;let lo=0,hi=Dm.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(Dm[m]<d)lo=m;else hi=m;}
    const f=(d-Dm[lo])/((Dm[hi]-Dm[lo])||1);return T[lo]+f*(T[hi]-T[lo]);};
  const res={durSec:Math.round(dur),durMin:dur/60,distKm:total/1000,avgPace:total>0?dur/(total/1000):null,reps:[]};
  res.win=function(W){let best=0;for(let t=0;t+W<=dur;t+=1){const dd=distAt(t+W)-distAt(t);if(dd>best)best=dd;}return best;};
  res.track=(function(){
    const lat0=pts[0].lat,lon0=pts[0].lon,kx=111320*Math.cos(lat0*Math.PI/180),ky=110540,N=Math.min(240,pts.length),out=[];
    for(let k=0;k<N;k++){
      const t=dur*k/(N-1),i=Math.min(pts.length-1,Math.max(0,Math.round(k*(pts.length-1)/(N-1))));
      const v=(distAt(Math.min(dur,t+8))-distAt(Math.max(0,t-8)))/(Math.min(dur,t+8)-Math.max(0,t-8)||1);
      out.push([Math.round((pts[i].lon-lon0)*kx),Math.round((pts[i].lat-lat0)*ky),Math.round(t),v>0.5?Math.round(1000/v):null]);
    }
    return out;
  })();
  if(!plan||plan.kind!=='intervals')return res;
  const tgtSpeed=1000/plan.pace,thr=Math.max(2.4,tgtSpeed*.82),W=15;
  const sp=[];for(let t=0;t+W<=dur;t+=5)sp.push({c:t+W/2,v:(distAt(t+W)-distAt(t))/W});
  let runs=[],cur=null;
  sp.forEach(x=>{if(x.v>=thr){if(cur)cur.e=x.c;else cur={s:x.c,e:x.c};}else if(cur){runs.push(cur);cur=null;}});
  if(cur)runs.push(cur);
  const merged=[];runs.forEach(r=>{const p=merged[merged.length-1];if(p&&r.s-p.e<12)p.e=r.e;else merged.push({s:r.s,e:r.e});});
  const effSec=plan.eff.t==='time'?plan.eff.v:plan.eff.v/tgtSpeed;
  const minLen=Math.max(12,.6*effSec);
  let cands=merged.map(r=>({s:r.s-W/2,e:r.e+W/2})).filter(r=>r.e-r.s>=minLen);
  const out=cands.map(r=>{
    const a=Math.max(0,r.s-8),b=Math.min(dur,r.e+8);let best=null;
    if(plan.eff.t==='time'){
      const w=plan.eff.v;
      for(let t=a;t+w<=b;t+=1){const d=distAt(t+w)-distAt(t);if(!best||d>best.dist)best={sec:w,dist:d,t0:t};}
    }else{
      const m=plan.eff.v;
      for(let t=a;t<=b;t+=1){const d0=distAt(t);if(d0+m>distAt(b))break;const t2=timeAtDist(d0+m);const w=t2-t;if(w>0&&(!best||w<best.sec))best={sec:w,dist:m,t0:t};}
    }
    if(!best)return null;best.pace=best.sec/(best.dist/1000);best.avgSpeed=best.dist/best.sec;best.at=r.s;return best;
  }).filter(Boolean);
  let reps=out;
  if(reps.length>plan.n){reps=reps.slice().sort((x,y)=>y.avgSpeed-x.avgSpeed).slice(0,plan.n).sort((x,y)=>x.at-y.at);res.extra=out.length-plan.n;}
  res.reps=reps;
  res.repWin=reps.map(r=>[Math.round(r.t0),Math.round(r.t0+r.sec)]);
  return res;
}

/* ================= Charge hebdomadaire ================= */
const loadOf=l=>(l.durMin&&l.rpe)?Math.round(l.durMin*l.rpe):0;
function weeklyLoads(n){
  const cur=mondayOf(todayStr());const out=[];
  for(let i=n-1;i>=0;i--){
    const ws=addDays(cur,-7*i),we=addDays(ws,6);
    const ls=S.logs.filter(l=>l.date>=ws&&l.date<=we);
    out.push({ws,load:ls.reduce((a,l)=>a+loadOf(l),0),n:ls.length,cur:i===0});
  }
  for(let i=1;i<out.length;i++){const p=out[i-1].load;out[i].delta=(p>0&&out[i].load>0)?out[i].load/p-1:null;
    out[i].alert=out[i].delta!=null&&out[i].delta>S.profile.alertPct/100;}
  return out;
}

/* ================= Fichiers : sauvegarde, rappels ================= */
async function saveFile(name,text,mime){
  try{
    if(window.claude&&window.claude.use){
      const dl=await window.claude.use('downloads');
      if(dl){
        try{await dl.save({filename:name,data:text});return 'ok';}
        catch(e){
          if(e&&e.code==='declined')return 'declined';
          if(e&&e.code==='rejected_extension'){try{await dl.save({filename:name+'.txt',data:text});return 'renamed';}catch(e2){return 'declined';}}
        }
      }
    }
  }catch(e){}
  try{
    const b=new Blob([text],{type:mime});const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);return 'ok';
  }catch(e){return 'error';}
}
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function buildIcs(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Souffle//FR','CALSCALE:GREGORIAN','X-WR-CALNAME:Souffle'];
  const tm=(S.profile.remindTime||'18:30').split(':');const hh=pad(+tm[0]||18),mm=pad(+tm[1]||0);
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const act=P();
  S.plans.filter(pl=>pl===act||pl.start>todayStr()).forEach(pl=>{
  for(let wk=1;wk<=pl.weeks;wk++){
    pl.keys.forEach(key=>{
      const isAct=pl===act,detailed=pl.type==='maintien'||wk<=PLAN_WEEKS;
      const pdate=addDays(pl.start,7*(wk-1)+DOW[key]);
      if(pl.closed&&pdate>pl.closed)return;
      const date=isAct&&detailed?(S.moves[sessIdOf(pl,wk,key)]||pdate):pdate;
      const isT=key==='sat'&&isTestWeekOf(pl,wk);
      const nm=isT?'Test VMA':{tue:'Fractionné doux (veille de hand)',thu:'Footing facile et renforcement',sat:'Séance clé'}[key];
      let desc=pl.name+' · semaine '+wk+(pl.type==='maintien'?'':' · '+(PHASES.find(q=>wk>=q.w[0]&&wk<=q.w[1])||PHASES[3]).name);
      if(detailed){desc+='\n'+(isT&&!isAct?'Test VMA : 6 min à fond.':isAct?sessionSummary(buildSession(wk,key,{noToday:true})):ladderLabel(key,baseLevel(pl.type,pl.shift,key,wk)));}
      else desc+=isT?'\nTest VMA : 6 min à fond.':'\nDétail à définir après la phase 1.';
      const d=date.replace(/-/g,'');
      L.push('BEGIN:VEVENT','UID:'+sessIdOf(pl,wk,key)+'@souffle','DTSTAMP:'+stamp,'DTSTART:'+d+'T'+hh+mm+'00','DURATION:PT1H',
        'SUMMARY:'+icsEsc('Souffle · '+nm),'DESCRIPTION:'+icsEsc(desc),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc('Séance dans 30 min'),'TRIGGER:-PT30M','END:VALARM','END:VEVENT');
    });
  }
  });
  L.push('END:VCALENDAR');return L.join('\r\n');
}


/* ================= Sauvegarde externe (dépôt GitHub privé) ================= */
const META='souffle.sync';          // jeton et état : stockés à part, jamais dans l'export
function readMeta(){try{return JSON.parse(localStorage.getItem(META)||'{}')||{};}catch(e){return {};}}
function writeMeta(p){try{localStorage.setItem(META,JSON.stringify(Object.assign(readMeta(),p)));}catch(e){}}
let syncBusy=false,syncTimer=null,lastPushed='',confirmRestore=null;
const b64e=t=>btoa(unescape(encodeURIComponent(t)));
const b64d=t=>decodeURIComponent(escape(atob(t.replace(/\s/g,''))));
const richness=o=>((o&&o.logs?o.logs.length:0)+(o&&o.pains?o.pains.length:0));
function ghUrl(path){const c=S.sync;return 'https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+(path||'');}
const ghFile=()=>'/contents/'+encodeURIComponent(S.sync.path);
async function gh(method,url,body){
  const tok=readMeta().token;if(!tok)throw new Error('Aucun jeton enregistré.');
  const headers={'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(body)headers['Content-Type']='application/json';
  let r;try{r=await fetch(url,{method:method,headers:headers,body:body?JSON.stringify(body):undefined});}
  catch(e){throw new Error('Pas de connexion à GitHub.');}
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){
    const e=new Error(r.status===401?'Jeton refusé ou expiré.':r.status===403?'Droits insuffisants pour ce jeton (il faut « Contents : Read and write »).':r.status===404?'Dépôt ou fichier introuvable (404). Vérifie le compte, le nom du dépôt et les droits du jeton.':((j&&j.message)||('Erreur '+r.status)));
    e.status=r.status;throw e;
  }
  return j;
}
async function syncPush(opts){
  opts=opts||{};const c=S.sync;const meta=readMeta();
  if(syncBusy||!meta.token||(!opts.manual&&!c.auto))return;
  syncBusy=true;
  try{
    const body=JSON.stringify(S,null,1);
    if(!opts.manual&&body===lastPushed)return;
    const repo=await gh('GET',ghUrl());
    if(repo.private!==true)throw new Error('Le dépôt « '+c.repo+' » est public : envoi refusé. Utilise un dépôt privé.');
    let sha=null,remote=null;
    try{const f=await gh('GET',ghUrl(ghFile()));sha=f.sha;try{remote=JSON.parse(b64d(f.content));}catch(e){}}
    catch(e){if(e.status!==404)throw e;}
    if(remote&&!opts.force&&richness(remote)>richness(S)){

const WX_KEY='souffle.wx',WX_TTL=2*3600e3;
let WX=null,wxBusy=false,wxMsg='',geoRes=null,wxQ='';
try{WX=JSON.parse(localStorage.getItem(WX_KEY)||'null');}catch(e){WX=null;}
function saveWx(){try{localStorage.setItem(WX_KEY,JSON.stringify(WX));}catch(e){}}
const locOk=()=>{const l=S.profile.loc;return !!(l&&isFinite(l.lat)&&isFinite(l.lon));};
async function wxRefresh(force){
  if(!locOk()||wxBusy)return;
  const l=S.profile.loc;
  if(!force&&WX&&WX.lat===l.lat&&WX.lon===l.lon&&Date.now()-WX.t<WX_TTL)return;
  if(navigator.onLine===false){wxMsg='Hors ligne : dernière météo affichée.';return;}
  wxBusy=true;
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude='+l.lat+'&longitude='+l.lon
      +'&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,wind_speed_10m,weather_code'
      +'&daily=sunrise,sunset&timezone=auto&forecast_days=5&wind_speed_unit=kmh';
    const r=await fetch(u);if(!r.ok)throw new Error('http '+r.status);
    const j=await r.json();
    WX={t:Date.now(),lat:l.lat,lon:l.lon,time:j.hourly.time,temp:j.hourly.temperature_2m,app:j.hourly.apparent_temperature,
      pp:j.hourly.precipitation_probability,pr:j.hourly.precipitation,wind:j.hourly.wind_speed_10m,code:j.hourly.weather_code,
      sun:{day:j.daily.time,rise:j.daily.sunrise,set:j.daily.sunset}};
    saveWx();wxMsg='';
  }catch(e){wxMsg='Météo indisponible pour le moment.';}
  finally{wxBusy=false;if(!draft&&!painForm&&!verdict)render();}
}
async function wxSearch(q){
  const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=5&language=fr&format=json');
  if(!r.ok)throw new Error('http');
  const j=await r.json();
  return (j.results||[]).map(x=>({name:x.name,area:[x.admin1,x.country].filter(Boolean).join(', '),lat:Math.round(x.latitude*100)/100,lon:Math.round(x.longitude*100)/100}));
}
function wxAt(date,hour){
  if(!WX||!WX.time)return null;
  const i=WX.time.indexOf(date+'T'+pad(hour)+':00');if(i<0)return null;
  return {temp:WX.temp[i],app:WX.app[i],pp:WX.pp[i],pr:WX.pr[i],wind:WX.wind[i],code:WX.code[i]};
}
function sunOf(date){
  const k=(WX&&WX.sun&&WX.sun.day)?WX.sun.day.indexOf(date):-1;
  return k<0?null:{rise:WX.sun.rise[k].slice(11,16),set:WX.sun.set[k].slice(11,16)};
}
const hmNum=t=>{const p=t.split(':');return +p[0]+ +p[1]/60;};
function sessionHour(){const t=(S.profile.remindTime||'18:30').split(':');return {h:+t[0]||18,m:+t[1]||0};}
function wcode(c){
  if(c===0)return 'ciel dégagé';if(c===1)return 'plutôt dégagé';if(c===2)return 'partiellement nuageux';if(c===3)return 'couvert';
  if(c===45||c===48)return 'brouillard';if(c>=51&&c<=57)return 'bruine';if(c===66||c===67)return 'pluie verglaçante';
  if(c>=61&&c<=65)return 'pluie';if(c>=71&&c<=77)return 'neige';if(c>=80&&c<=82)return 'averses';if(c===85||c===86)return 'averses de neige';
  if(c>=95)return 'orage';return 'variable';
}
function wxAdvice(date,sh){
  const f=sh.h+sh.m/60,hh=Math.min(23,Math.floor(f+.5));
  const w=wxAt(date,hh);if(!w||w.temp==null)return null;
  const sun=sunOf(date),tips=[],eff={},app=w.app==null?w.temp:w.app;
  if(app>=32){eff.level=-1;eff.heatText='Forte chaleur ('+Math.round(app)+' °C ressentis) : séance allégée d’un cran. Bois avant et pendant.';tips.push(eff.heatText);}
  else if(app>=28){eff.slow=1.04;eff.heatText='Chaleur ('+Math.round(app)+' °C ressentis) : allure visée ralentie de 4 %. Hydrate-toi.';tips.push(eff.heatText);}
  if(w.temp<=0.5){eff.ice=true;eff.iceText='Gel possible ('+Math.round(w.temp)+' °C) : pas de fractionné sur sol glissant, footing facile à la place.';tips.push(eff.iceText);}
  else if(app<=3)tips.push('Froid : échauffement plus long (15 min), couvre mains et oreilles.');
  if((w.pp!=null&&w.pp>=60)||w.pr>=1)tips.push('Pluie probable ('+(w.pp==null?'':w.pp+' %')+') : tenue adaptée et prudence dans les virages.');
  if(w.wind>=35)tips.push('Vent fort ('+Math.round(w.wind)+' km/h) : juge l’allure au ressenti plutôt qu’au chrono.');
  if(sun&&f>=hmNum(sun.set)-.25)tips.push('Nuit à '+sun.set+' : gilet réfléchissant ou lampe frontale.');
  return {w,tips,eff};
}
function slotScore(w,night){
  const app=w.app==null?w.temp:w.app;
  let sc=Math.abs(app-12)*.6+(w.pp||0)*.05+(w.pr||0)*3+Math.max(0,w.wind-15)*.25;
  if(app>25)sc+=(app-25)*1.5;if(w.temp<=.5)sc+=10;if(night)sc+=25;return sc;
}
function bestSlot(date){
  const sun=sunOf(date);if(!sun||!WX)return null;
  const now=new Date(),isToday=date===todayStr(),minH=isToday?now.getHours()+1:7;
  let best=null;
  for(let h=Math.max(7,minH);h<=20;h++){
    const a=wxAt(date,h),b=wxAt(date,h+1);if(!a||!b||a.temp==null||b.temp==null)continue;
    const night=(h+2)>hmNum(sun.set)+.25||h<hmNum(sun.rise);
    const sc=(slotScore(a,night)+slotScore(b,night))/2;
    if(!best||sc<best.sc)best={h:h,sc:sc,a:a,b:b,night:night};
  }
  return best;
}

  h+='<div class="row between"><div class="row">'+rolePill(s)+'<span class="muted small">'+esc(isToday?'Aujourd\u2019hui':frDate(s.date))+'</span></div><span class="small muted">Sem. '+s.wk+'</span></div>';
  if(s.kind==='intervals'){
    h+='<div class="spec tnum">'+s.n+' × '+esc(fmtEff(s.eff)).replace(' min','<small> min</small>').replace(/(\d) m$/,'$1<small> m</small>')+'</div>';
    h+='<div class="muted">Récupération '+esc(fmtRest(s.rest.s))+' '+esc(s.rest.m)+'</div>';
    h+='<dl class="kv"><dt>Allure à l\u2019effort</dt><dd class="tnum">≈ '+esc(fmtPace(s.pace))+'/km</dd><dt>Ressenti visé</dt><dd>'+esc(s.rpeTarget)+'</dd><dt>Avant / après</dt><dd>'+s.warm+' min d\u2019échauffement · '+s.cool+' min de retour au calme</dd></dl>';
  }else if(s.kind==='test'){
    h+='<div class="spec tnum">6<small> min</small></div><div class="muted">Test VMA : la plus grande distance possible, à allure régulière</div>';
    h+='<dl class="kv"><dt>Ressenti visé</dt><dd>'+esc(s.rpeTarget)+'</dd><dt>Avant / après</dt><dd>'+s.warm+' min d\u2019échauffement · '+s.cool+' min de retour au calme</dd><dt>Conseil</dt><dd>Pars régulier : trop vite au départ fausse le test.</dd></dl>';
  }else if(s.kind==='easy'){
    h+='<div class="spec tnum">'+s.minutes+'<small> min</small></div><div class="muted">Footing très facile, allure ≈ '+esc(fmtPace(s.pace))+'/km</div>';
    h+='<dl class="kv"><dt>Ressenti visé</dt><dd>'+esc(s.rpeTarget)+'</dd></dl>';
  }else{h+='<div class="spec">Repos</div><div class="muted">Pas de course tant que la douleur n\u2019est pas réglée.</div>';}
  if(s.pain)h+='<div class="banner '+s.pain.cls+'" style="margin-top:12px"><div>'+esc(s.pain.t)+'</div></div>';
  if(s.adj.length){h+='<div class="label" style="margin-top:14px">Pourquoi ce niveau</div><ul class="clean">'+s.adj.map(a=>'<li>'+esc(a.t)+'</li>').join('')+'</ul>';}
  if(s.date!==s.planned)h+='<div class="hint" style="margin-top:8px">Déplacée depuis le '+esc(frShort(s.planned))+'.</div>';
  const ck=checkSpacing(s);if(ck)h+='<div class="banner warn" style="margin-top:12px"><div>'+esc(ck)+'</div></div>';
  h+='<div class="row" style="margin-top:16px">';
  if(s.kind!=='rest')h+='<button class="btn primary" style="flex:1" data-act="open-log" data-id="'+s.id+'">Noter la séance</button>';
  h+='<button class="btn" data-act="move" data-id="'+s.id+'">Déplacer</button><button class="btn" data-act="skip" data-id="'+s.id+'">Sauter</button></div>';
  if(moving===s.id)h+=moveForm(s);
  h+='</div></div>';return h;
}

function weekGlance(wk){
  const list=weekSessions(wk,{noToday:true});const ws=weekStart(wk);
  let h='<div class="card"><div class="label">Semaine '+wk+'</div>';
  const rows=list.map(s=>({d:s.date,html:'<div class="item" style="padding:8px 0"><div class="row between"><div><b>'+esc(frDate(s.date,{weekday:'long'}))+'</b> <span class="muted small">'+esc(frDate(s.date,{day:'numeric',month:'short'}))+'</span></div><div>'+(s.done?'<span class="pill good">Fait</span>':s.skipped?'<span class="pill">Sautée</span>':rolePill(s))+'</div></div><div class="small muted">'+esc(sessionSummary(s))+'</div></div>'}));
  rows.push({d:addDays(ws,DOW.wed),html:'<div class="item" style="padding:8px 0"><div class="row between"><div><b>Mercredi</b> <span class="muted small">'+esc(frDate(addDays(ws,DOW.wed),{day:'numeric',month:'short'}))+'</span></div>'+pill('hand','Hand')+'</div><div class="small muted">1 h de jeu, compté dans la charge</div></div>'});
  rows.sort((a,b)=>a.d<b.d?-1:1);return h+rows.map(r=>r.html).join('')+'</div>';
}
function checkSpacing(s){
  const hard=['sat'];
  const others=[];
  const ws=weekStart(s.wk);others.push({d:addDays(ws,DOW.wed),n:'le hand du mercredi'});
  weekSessions(s.wk,{noToday:true}).forEach(o=>{if(o.id!==s.id&&(o.key==='sat'||o.key==='tue'))others.push({d:o.date,n:'la séance de '+frDate(o.date,{weekday:'long'})});});
  if(s.key==='sat'||s.key==='tue'){
    for(const o of others){
      const gap=Math.abs(diffDays(s.date,o.d));
      const isPair=(s.key==='tue'&&o.n==='le hand du mercredi');
      if(isPair)continue;
      if(s.key==='sat'&&gap<2)return 'Moins de 48 h avec '+o.n+'. Garde cette séance en intensité modérée ou décale-la.';
      if(s.key==='tue'&&gap<1)return 'Même jour que '+o.n+'.';
    }
  }
  return '';
}
function moveForm(s){
  const ws=mondayOf(s.planned);let opts='';
  for(let i=0;i<7;i++){const d=addDays(ws,i);opts+='<option value="'+d+'"'+(d===s.date?' selected':'')+'>'+esc(frDate(d,{weekday:'long',day:'numeric',month:'short'}))+'</option>';}
  return '<div class="sep" style="margin-top:16px"></div><div class="field" style="margin-top:12px"><label for="mv-date">Nouveau jour (même semaine)</label><select id="mv-date">'+opts+'</select></div><div class="row" style="margin-top:12px"><button class="btn primary sm" data-act="move-ok" data-id="'+s.id+'">Valider</button><button class="btn sm" data-act="move-cancel">Annuler</button></div><div class="hint" style="margin-top:8px">L\u2019app te signale si le nouveau jour est trop proche du hand ou d\u2019une autre séance dure.</div>';
}

/* ---- Reprogrammer un plan ---- */
function rollPlan(){
  const pl=P();
  if(S.activeSeen===undefined){S.activeSeen=pl.id;return;}
  if(S.activeSeen!==pl.id){S.activeSeen=pl.id;S.offsets={sat:0,tue:0,thu:0};if(pl.refPace)S.profile.refPace=pl.refPace;save();}
}
function shiftFor(level){
  const old=P(),sh={sat:0,tue:0,thu:0};
  if(level==='current')['sat','tue','thu'].forEach(k=>{sh[k]=clamp(((old.shift||{})[k]||0)+(S.offsets[k]||0),-2,3);});
  return sh;
}
function previewPlan(type,level){
  const sh=shiftFor(level),keys=type==='maintien'?['tue','sat']:['tue','thu','sat'],nm={tue:'Mardi',thu:'Jeudi',sat:'Samedi'};
  return keys.map(k=>nm[k]+' : '+ladderLabel(k,baseLevel(type,sh,k,1)));
}
function nextMondayFrom(d){const dow=(parseD(d).getDay()+6)%7;return dow===0?d:addDays(d,7-dow);}
function newPlanDraft(){
  const pl=P(),today=todayStr();let start=nextMondayFrom(today);
  const after=addDays(planEnd(pl),1);if(currentWeek()>=pl.weeks-1&&after>=today)start=after;
  return {type:'cycle',level:'current',start:start,ref:fmtPace(S.profile.refPace),confirm:false};
}
function validateNewPlan(){
  const np=newPlan;
  if(!np.start||parseD(np.start).getDay()!==1)return 'Le plan démarre un lundi : choisis un lundi.';
  if(np.start<todayStr())return 'La date de début ne peut pas être dans le passé.';
  if(np.start<=P().start)return 'Le nouveau plan doit commencer après le début du plan en cours.';
  const r=parsePace(np.ref);if(!r||r<180||r>720)return 'Allure de référence invalide (format 6\'20).';
  return '';
}
function createPlan(np){
  const shift=shiftFor(np.level);
  S.plans=S.plans.filter(q=>q.start<=todayStr());          // un plan programmé mais pas commencé est remplacé
  const cycles=S.plans.filter(q=>q.type==='cycle').length,maint=S.plans.filter(q=>q.type==='maintien').length;
  const before=S.plans.filter(q=>q.start<np.start).sort((a,b)=>a.start<b.start?-1:1).pop();
  if(before)before.closed=addDays(np.start,-1);
  S.planSeq=(S.planSeq||S.plans.length)+1;
  S.plans.push({id:'p'+S.planSeq,type:np.type,name:np.type==='maintien'?'Maintien '+(maint+1):'Cycle '+(cycles+1),start:np.start,
    weeks:np.type==='maintien'?12:16,keys:np.type==='maintien'?['tue','sat']:['tue','thu','sat'],shift:shift,level:np.level,refPace:parsePace(np.ref),closed:null,created:todayStr()});
  S.plans.sort((a,b)=>a.start<b.start?-1:1);
}
function planBanner(){
  const wk=currentWeek(),pl=P();if(wk<1)return '';

  if(up)return '';
  const btn='<div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="newplan">Reprogrammer un plan</button></div>';
  if(wk>pl.weeks)return '<div class="banner info"><div><b>« '+esc(pl.name)+' » est terminé.</b> Choisis la suite : nouveau cycle ou maintien.'+btn+'</div></div>';
  if(wk>=pl.weeks-1)return '<div class="banner info"><div><b>Ton plan se termine le '+esc(frDate(planEnd(pl),{day:'numeric',month:'long'}))+'.</b> Prépare la suite dès maintenant.'+btn+'</div></div>';
  return '';
}

function logDetails(l){

/* ---- Tracés (gardés sur ce téléphone seulement, jamais exportés ni sauvegardés) ---- */
const TRK='souffle.tracks';
function readTracks(){try{return JSON.parse(localStorage.getItem(TRK)||'{}')||{};}catch(e){return {};}}
function writeTracks(o){try{const ids=Object.keys(o);if(ids.length>150){ids.slice(0,ids.length-150).forEach(k=>delete o[k]);}localStorage.setItem(TRK,JSON.stringify(o));}catch(e){}}
function putTrack(id,a){if(!a||!a.track)return;const o=readTracks();o[id]={pts:a.track,reps:a.repWin||[]};writeTracks(o);}
function dropTrack(id){const o=readTracks();if(o[id]){delete o[id];writeTracks(o);}}
function traceSvg(id){
  const tk=readTracks()[id];if(!tk||!tk.pts||tk.pts.length<2)return '';
  const P=tk.pts,xs=P.map(q=>q[0]),ys=P.map(q=>q[1]);
  const x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  const W=320,H=240,m=18,sc=Math.min((W-2*m)/Math.max(1,x1-x0),(H-2*m)/Math.max(1,y1-y0));
  const ox=(W-sc*(x1-x0))/2,oy=(H-sc*(y1-y0))/2;
  const X=x=>(ox+(x-x0)*sc).toFixed(1),Y=y=>(H-(oy+(y-y0)*sc)).toFixed(1);
  const vs=P.map(q=>q[3]).filter(Boolean).sort((a,b)=>a-b);
  const fast=vs.length?vs[Math.floor(vs.length*.1)]:300,slow=Math.min(540,vs.length?vs[Math.floor(vs.length*.9)]:420);if(slow<=fast+20)slow=fast+60;
  const col=pc=>{if(!pc)return 'rgb(140,150,170)';const f=Math.max(0,Math.min(1,(slow-pc)/((slow-fast)||1)));const A=[70,120,230],B=[245,120,30];return 'rgb('+A.map((c,i)=>Math.round(c+(B[i]-c)*f)).join(',')+')';};
  const inRep=t=>(tk.reps||[]).some(r=>t>=r[0]&&t<=r[1]);
  let seg='';
  for(let i=1;i<P.length;i++){
    const e=inRep(P[i][2]);
    seg+='<line x1="'+X(P[i-1][0])+'" y1="'+Y(P[i-1][1])+'" x2="'+X(P[i][0])+'" y2="'+Y(P[i][1])+'" stroke="'+col(P[i][3])+'" stroke-width="'+(e?6:2.6)+'" stroke-linecap="round"/>';
  }
  const a=P[0],z=P[P.length-1];
  const stat=(tk.reps&&tk.reps.length?'Efforts épais : '+tk.reps.length+' · ':'')+'Couleur = allure (bleu lent, orange rapide, de '+fmtPace(slow)+' à '+fmtPace(fast)+'/km)';
  return '<div class="trace"><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Tracé de la course, sans fond de carte">'+seg
    +'<circle cx="'+X(a[0])+'" cy="'+Y(a[1])+'" r="6" fill="var(--surface)" stroke="var(--good)" stroke-width="3"/>'
    +'<rect x="'+(+X(z[0])-5)+'" y="'+(+Y(z[1])-5)+'" width="10" height="10" rx="2" fill="var(--surface)" stroke="var(--bad)" stroke-width="3"/></svg>'
    +'<div class="small muted" style="margin-top:6px">Départ : rond vert · arrivée : carré rouge. '+esc(stat)+'. Le tracé reste sur ce téléphone, sans fond de carte.</div></div>';
}

async function takeSharedFile(){
  try{

    history.replaceState(null,'',location.pathname);
    const c=await caches.open('souffle-share'),r=await c.match('shared-gpx');if(!r)return;

    draft=newDraft('run',sess);

  }catch(e){toast('Fichier partagé illisible.');}
}

/* ================= Rendu & événements ================= */
function render(){
  rollPlan();
  const app=document.getElementById('app'),tabs=document.getElementById('tabs');
  let h;
  if(verdict)h=viewVerdict();
  else if(painForm)h=viewPain();
  else if(newPlan)h=viewNewPlan();
  else if(draft)h=viewLog();
  else h=({today:viewToday,plan:viewPlan,track:viewTrack,settings:viewSettings})[view]();
  app.innerHTML=h;
  const overlay=verdict||painForm||draft||newPlan;
  tabs.parentNode.hidden=!!overlay;
  tabs.innerHTML=TABS.map(t=>'<button data-act="tab" data-v="'+t[0]+'"'+(view===t[0]?' aria-current="page"':'')+'>'+ICON[t[0]==='today'?'today':t[0]==='plan'?'plan':t[0]==='track'?'track':'settings']+t[1]+'</button>').join('');
}
function nextAfter(s){
  for(let w=s.wk+1;w<=detailedWeeks();w++){const n=buildSession(w,s.key,{noToday:true});if(n)return {when:'Semaine '+w+' · '+frDate(n.date,{weekday:'long',day:'numeric',month:'long'}),what:sessionSummary(n)};}
  return null;
}
function trashLog(id){
  const l=S.logs.find(x=>x.id===id);if(!l)return;
  const fx=l.fx||(l.delta&&l.key?{[l.key]:l.delta}:{});
  ['sat','tue','thu'].forEach(k=>{if(fx[k])S.offsets[k]=clamp((S.offsets[k]||0)-fx[k],-2,2);});
  S.logs=S.logs.filter(x=>x!==l);S.trash=(S.trash||[]).concat([Object.assign({},l,{delAt:todayStr()})]);
}
function restoreLog(id){
  const l=(S.trash||[]).find(x=>x.id===id);if(!l)return false;
  if(l.sessionId&&logFor(l.sessionId)){toast('Cette séance du plan a déjà un autre bilan : mets-le à la corbeille d\u2019abord.');return false;}
  const fx=l.fx||(l.delta&&l.key?{[l.key]:l.delta}:{});
  ['sat','tue','thu'].forEach(k=>{if(fx[k])S.offsets[k]=clamp((S.offsets[k]||0)+fx[k],-2,2);});
  S.trash=S.trash.filter(x=>x!==l);const c=Object.assign({},l);delete c.delAt;S.logs.push(c);return true;
}
function findDup(date,dur,dist){
  return S.logs.find(l=>l.date===date&&Math.abs((l.durMin||0)-(dur||0))<=2&&Math.abs((l.distKm||0)-(dist||0))<=0.25);
}
function saveLog(){
  const d=draft;const sess=d.sessionId?sessionById(d.sessionId):null;
  const num=x=>{const n=parseFloat(String(x).replace(',','.'));return isFinite(n)?n:null;};
  const log={id:'l'+Date.now(),kind:d.kind==='run'?'run':d.kind,key:null,sessionId:null,date:d.date,durSec:parseDur(d.durMin),durMin:parseDur(d.durMin)==null?null:parseDur(d.durMin)/60,name:(d.name||'').trim(),distKm:num(d.distKm),
    repsDone:null,repsPlanned:null,avgPace:parsePace(d.avgPace),firstPace:parsePace(d.firstPace),lastPace:parsePace(d.lastPace),
    hrAvg:num(d.hrAvg),hrMax:num(d.hrMax),rpe:d.rpe,reason:d.reason,verdict:null,delta:0,source:d.gpxRes?'gpx':'manuel',note:''};
  if(String(d.durMin).trim()&&log.durSec==null){toast('Durée illisible : écris 18:05 ou 33 (minutes).');return;}
  if(d.kind==='test'){
    const dist=parseFloat(String(d.testDist).replace(',','.'));
    if(!(dist>200&&dist<6000)){toast('Indique la distance parcourue pendant le test, en mètres.');return;}
    const vma=Math.round(vmaOf(d.testType,dist)*10)/10;
    log.test={type:d.testType,distM:Math.round(dist),vma:vma};
    if(sess&&sess.kind==='test'){log.sessionId=sess.id;}
  }
  let notes=[];let label=null;
  if(d.gpxRes){
    const dup=findDup(log.date,log.durMin,log.distKm);
    if(dup&&dup.sessionId){toast('Cette course est déjà enregistrée dans le suivi.');return;}
    if(dup){S.logs=S.logs.filter(x=>x!==dup);dropTrack(dup.id);if(log.rpe==null&&dup.rpe)d.rpe=log.rpe=dup.rpe;notes.push('Cette course existait déjà (séance du '+frShort(dup.date)+') : elle est remplacée, pas doublée.');}
  }
  if(d.kind==='run'&&sess){
    log.key=sess.key;log.sessionId=sess.id;
    if(sess.kind==='intervals'){log.repsDone=num(d.repsDone);log.repsPlanned=sess.n;log.effT=sess.eff.t;log.effLabel=sess.eff.t==='time'?(sess.eff.v%60===0?sess.eff.v/60+' min':sess.eff.v+' s'):sess.eff.v+' m';
      if(d.gpxRes&&d.gpxRes.reps&&d.gpxRes.reps.length)log.reps=d.gpxRes.reps.map(r=>[Math.round(r.sec*10)/10,Math.round(r.dist)]);}
    const res=judge(sess,{rpe:d.rpe,repsDone:log.repsDone,avgPace:log.avgPace,firstPace:log.firstPace,lastPace:log.lastPace,reason:d.reason});
    if(d.rpe!=null){notes=applyJudgement(sess,res,log);}else{notes=res.notes;}
    label=log.verdict;
  }else if(d.kind==='test'){
    const prev=vmaTests().filter(x=>x.id!==log.id).pop();
    notes.push('Test VMA enregistré : '+fmtKmh(log.test.vma)+' km/h, soit '+fmtPace(3600/log.test.vma)+'/km à 100 %.');
    if(prev)notes.push('Test précédent ('+frShort(prev.date)+') : '+fmtKmh(prev.test.vma)+' km/h, écart '+(log.test.vma>=prev.test.vma?'+':'')+fmtKmh(log.test.vma-prev.test.vma)+' km/h.');
    notes.push('Un test ne modifie pas les crans de progression. Va dans Suivi pour voir tes allures en pourcentage de VMA.');
  }else if(d.kind==='hand'){
    log.note='Hand';
    notes.push(d.rpe!=null&&log.durMin?'Charge du hand : '+Math.round(log.durMin*d.rpe)+' (durée × ressenti), comptée dans la semaine.':'Hand enregistré.');
    if(d.rpe>=8)notes.push('Hand intense : le jeudi reste très léger.');
  }else{notes.push('Séance enregistrée et comptée dans la charge.');}
  S.logs.push(log);
  if(d.gpxRes)putTrack(log.id,d.gpxRes);
  let pain=null;
  if(d.painZone&&d.painLevel){pain={date:d.date,zone:d.painZone,level:d.painLevel};S.pains.push(pain);}
  if(d.reason==='douleur'&&!pain)notes.push('Tu indiques une douleur : précise la zone avec « Signaler une douleur » pour adapter les prochaines séances.');
  save();
  verdict={label,notes,pain,trace:d.gpxRes?log.id:null,next:sess&&log.rpe!=null?nextAfter(sess):null};draft=null;
}
async function handleGpx(file){
  const d=draft;
  const sess=d.sessionId?sessionById(d.sessionId):null;
  try{
    const txt=await file.text();const pts=parseGpx(txt);const a=analyseTrack(pts,d.kind==='run'?sess:null);
    d.durMin=fmtDur(a.durSec);d.distKm=a.distKm.toFixed(2).replace('.',',');
    const day=new Date(pts[0].t*1000);d.date=ymd(day);
    let msg='GPX lu : '+fmtDur(a.durSec)+', '+a.distKm.toFixed(1).replace('.',',')+' km, allure moyenne '+fmtPace(a.avgPace)+'/km. ';
    if(sess&&sess.kind==='intervals'&&d.kind==='run'){
      if(a.reps.length){
        const paces=a.reps.map(r=>r.pace);const avg=a.reps.reduce((x,r)=>x+r.sec,0)/a.reps.reduce((x,r)=>x+r.dist/1000,0);
        d.repsDone=a.reps.length;d.avgPace=fmtPace(avg);d.firstPace=fmtPace(paces[0]);d.lastPace=fmtPace(paces[paces.length-1]);
        msg+=a.reps.length+' répétitions détectées sur '+sess.n+' prévues. Allures : '+paces.map(fmtPace).join(' · ')+'.'+(a.extra?' '+a.extra+' effort(s) en trop ignoré(s).':'')+' Vérifie les champs ci-dessous.';
      }else msg+='Aucune répétition détectée : saisis-les à la main.';
    }
    d.gpxRes=a;
    if(d.kind==='test'){
      const W=TEST_TYPES[d.testType].W;
      if(a.durSec<W)msg+='Fichier trop court pour un test '+TEST_TYPES[d.testType].lab+'. ';
      else{const bd=Math.round(a.win(W));d.testDist=String(bd);msg+='Meilleurs '+TEST_TYPES[d.testType].lab+' : '+bd+' m, soit une VMA ≈ '+fmtKmh(vmaOf(d.testType,bd))+' km/h. Vérifie la distance.';}
    }
    const dup=findDup(d.date,a.durMin,a.distKm);
    if(dup)msg=(dup.sessionId?'Déjà enregistrée dans le suivi : l\u2019import sera refusé. ':'Cette course existe déjà dans l\u2019historique : elle sera remplacée, pas doublée. ')+msg;
    d.gpxMsg=esc(msg);
  }catch(e){d.gpxRes=null;d.gpxMsg=esc(e.message||'Import impossible.');}
  render();
}
function copyText(t){
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copié.');}catch(e){toast('Copie impossible : sélectionne le texte à la main.');}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Copié.'),fallback);else fallback();
}

    case 'wx-geo':{if(!navigator.geolocation){toast('Position indisponible sur cet appareil.');break;}toast('Recherche de ta position…');
      try{const pos=await new Promise((ok,ko)=>navigator.geolocation.getCurrentPosition(ok,ko,{timeout:15000,maximumAge:600000}));
        S.profile.loc={name:'Ma position',lat:Math.round(pos.coords.latitude*100)/100,lon:Math.round(pos.coords.longitude*100)/100};save();wxRefresh(true);toast('Position enregistrée (arrondie à 1 km).');}
      catch(e){toast('Position refusée ou indisponible : cherche ta ville.');}break;}
    case 'wx-refresh':wxRefresh(true);toast('Actualisation…');break;
    case 'wx-clear':S.profile.loc=null;WX=null;saveWx();save();break;
    case 'sync-clear':writeMeta({token:'',lastErr:null,blocked:false});toast('Jeton retiré de ce téléphone.');break;
    case 'reset':confirmReset=true;break;
    case 'reset-cancel':confirmReset=false;break;
    case 'reset-ok':S=defaults();save();confirmReset=false;toast('Données effacées.');break;
    default:return;
  }
  render();
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.hasAttribute&&t.hasAttribute('data-ed')&&editDraft){editDraft[t.getAttribute('data-ed')]=t.value;return;}
  if(t.hasAttribute('data-f')&&draft){draft[t.getAttribute('data-f')]=t.value;}
  if(t.id==='wx-q')wxQ=t.value;
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='gpx'&&t.files&&t.files[0]){handleGpx(t.files[0]);return;}
  if(t.id==='imp'&&t.files&&t.files[0]){
    t.files[0].text().then(tx=>{try{const o=JSON.parse(tx);if(!o||o.v!==1||!Array.isArray(o.logs))throw 0;const cfg=S.sync;S=Object.assign(defaults(),o);S.sync=Object.assign({},defaults().sync,o.sync||{},cfg);save();toast('Sauvegarde importée.');}catch(e){toast('Fichier de sauvegarde non reconnu.');}render();});return;}
  if(t.getAttribute&&t.getAttribute('data-act')==='set-rpe'){const l=S.logs.find(x=>x.id===t.getAttribute('data-id'));if(l&&t.value){l.rpe=+t.value;save();render();}return;}
  if(t.getAttribute&&t.getAttribute('data-np')&&newPlan){newPlan[t.getAttribute('data-np')]=t.value.trim();return;}
  if(t.getAttribute&&t.getAttribute('data-sync')){const kk=t.getAttribute('data-sync');S.sync[kk]=t.value.trim();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}return;}
  const k=t.getAttribute&&t.getAttribute('data-set');
  if(k){
    const p=S.profile;
    if(k==='refPace'){const s=parsePace(t.value);if(s&&s>180&&s<720)p.refPace=s;else toast('Format attendu : 6\'20');}
    else if(k==='start'){if(t.value){if(parseD(t.value).getDay()!==1)toast('Le plan démarre un lundi : choisis un lundi.');else P().start=t.value;}}
    else if(k==='remindTime'){if(t.value)p.remindTime=t.value;}
    else{const n=parseFloat(t.value);if(isFinite(n)&&n>0)p[k]=n;}
    save();render();
  }
});
